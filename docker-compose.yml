version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_propay
    restart: always
    environment:
      - POSTGRES_DB=db_propay
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
    driver: local